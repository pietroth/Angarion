plugins {
    id 'java'
    id 'application'
    id 'eclipse'
}

allprojects {
    group = 'br.angarion.dev'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['app/src/main/java']
        }
    }
    test {
        java {
            srcDirs = ['app/src/test/java']
        }
    }
    jmh {
        java {
            srcDirs = ['app/src/jmh/java']
        }
        resources {
            srcDirs = ['app/src/jmh/resources']
        }
    }
}

dependencies {
    implementation project(':api')
    annotationProcessor project(':processors')

    jmhImplementation project(':engine')
    jmhImplementation project(':api')
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass.set('br.angarion.dev.App')
}

tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Runs the JMH benchmarks.'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass.set('org.openjdk.jmh.Main')
    args(
        'br.angarion.dev.benchmark.ResolverBenchmark',
        '-bm', 'thrpt',
        '-rf', 'text',
        '-rff', "$buildDir/reports/jmh/ResolverBenchmark.txt"
    )
    jvmArgs '-Xms1g', '-Xmx1g'
    dependsOn tasks.named('jmhClasses')
    doFirst {
        file("$buildDir/reports/jmh").mkdirs()
    }
}
